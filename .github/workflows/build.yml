name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign the Windows app (runs in the release environment, which allows only v* tags by default)
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: '--target universal-apple-darwin'
          - os: windows-latest
            platform: win
            args: ''
          - os: ubuntu-22.04
            platform: linux
            args: ''

    runs-on: ${{ matrix.os }}
    # Release builds sign the Windows app with Azure Artifact Signing, so Smart App Control lets it
    # run. Signing needs the release environment's Azure login, which only v* tags can use.
    environment: ${{ matrix.platform == 'win' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN_WINDOWS: ${{ matrix.platform == 'win' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # GStreamer plugins are copied into the AppImage (bundleMediaFramework)
          # so WebKitGTK can decode and play game audio on any distro.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Run native Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Sign in to Azure for signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Windows signing
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          ./scripts/windows-signing.ps1 -Setup
          # Tauri runs the signCommand for the app, its NSIS plugins, the uninstaller and both
          # installers, before it zips them and adds the updater signatures (.sig).
          $script = (Resolve-Path scripts/windows-signing.ps1).Path
          $config = Join-Path $env:RUNNER_TEMP 'tauri.windows-signing.conf.json'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-File', $script, '%1') } } } } |
            ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $config -Encoding utf8
          Get-Content -LiteralPath $config
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNING_ARGS=--config $($config -replace '\\', '/')" -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ env.WINDOWS_SIGNING_ARGS }}

      - name: Check the Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $installers = @{
            nsis = @(Get-Item "$bundle/nsis/*-setup.exe")
            msi = @(Get-Item "$bundle/msi/*.msi")
          }
          foreach ($kind in $installers.Keys) {
            if ($installers[$kind].Count -ne 1) { throw "Expected one $kind installer, found $($installers[$kind].Count)." }
          }
          $nsis = $installers.nsis[0].FullName
          $msi = $installers.msi[0].FullName
          $files = @($nsis, $msi)

          # Check the files the installers write: Tauri signs its own copies of the app, not target/release.
          $nsisContents = Join-Path $env:RUNNER_TEMP 'nsis-contents'
          7z x -y "-o$nsisContents" $nsis | Out-Null
          if ($LASTEXITCODE) { throw "7-Zip couldn't open $nsis." }
          $msiContents = Join-Path $env:RUNNER_TEMP 'msi-contents'
          $extract = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$msiContents`"" -Wait -PassThru
          if ($extract.ExitCode) { throw "msiexec couldn't extract $msi (exit code $($extract.ExitCode))." }
          foreach ($contents in $nsisContents, $msiContents) {
            $programs = @(Get-ChildItem $contents -Recurse -File -Include *.exe, *.dll |
              Where-Object { $_.FullName -notmatch '\\\$PLUGINSDIR\\' })
            if (-not ($programs | Where-Object Name -eq 'agent-arcade.exe')) { throw "$contents has no agent-arcade.exe." }
            $files += $programs.FullName
          }
          ./scripts/windows-signing.ps1 -Verify $files

          # The updater installs from the zipped installers (latest.json points at the .nsis.zip); they
          # must hold the signed installers and carry an updater signature made over them.
          foreach ($installer in $nsis, $msi) {
            $kind = if ($installer -eq $nsis) { 'nsis' } else { 'msi' }
            $zip = @(Get-Item "$bundle/$kind/*.$kind.zip" -ErrorAction SilentlyContinue)
            if ($kind -eq 'msi' -and -not $zip.Count) { continue }
            if ($zip.Count -ne 1) { throw "Expected one .$kind.zip updater artifact, found $($zip.Count)." }
            if (-not (Test-Path -LiteralPath "$($zip[0].FullName).sig")) { throw "$($zip[0].Name) has no updater signature." }
            $unzipped = Join-Path $env:RUNNER_TEMP "updater-$kind"
            Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unzipped -Force
            $inner = @(Get-ChildItem $unzipped -Recurse -File)
            if ($inner.Count -ne 1 -or (Get-FileHash $inner[0].FullName).Hash -ne (Get-FileHash $installer).Hash) {
              throw "$($zip[0].Name) doesn't hold the signed $(Split-Path $installer -Leaf)."
            }
            Write-Host "Updater artifact holds the signed installer: $($zip[0].Name)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-arcade-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.msi.sig
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.deb.sig
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.nsis.zip
            src-tauri/target/**/release/bundle/**/*.nsis.zip.sig
            src-tauri/target/**/release/bundle/**/*.AppImage.sig
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.rpm.sig
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate updater manifest (latest.json)
        env:
          MAC_SIG: ''
          WIN_SIG: ''
          LINUX_SIG: ''
          MAC_FILE: ''
          WIN_FILE: ''
          LINUX_FILE: ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_URL="https://github.com/DanWahlin/agent-arcade/releases/download/${GITHUB_REF_NAME}"

          # Read signature files into env vars (safe from shell interpolation)
          MAC_SIG=$(find artifacts -name "*.app.tar.gz.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")
          WIN_SIG=$(find artifacts -name "*.nsis.zip.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")
          LINUX_SIG=$(find artifacts -name "*.AppImage.tar.gz.sig" -type f -exec cat {} \; -quit 2>/dev/null || echo "")

          MAC_FILE=$(find artifacts -name "*.app.tar.gz" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)
          WIN_FILE=$(find artifacts -name "*.nsis.zip" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)
          LINUX_FILE=$(find artifacts -name "*.AppImage.tar.gz" ! -name "*.sig" -type f -exec basename {} \; 2>/dev/null | head -1)

          # Use env vars via process.env to avoid shell interpolation issues
          export VERSION BASE_URL MAC_SIG WIN_SIG LINUX_SIG MAC_FILE WIN_FILE LINUX_FILE
          node -e "
            const { VERSION, BASE_URL, MAC_SIG, WIN_SIG, LINUX_SIG, MAC_FILE, WIN_FILE, LINUX_FILE } = process.env;
            const p = {};
            const enc = f => f ? encodeURI(f) : '';
            if (MAC_SIG && MAC_FILE) {
              const url = BASE_URL + '/' + enc(MAC_FILE);
              p['darwin-aarch64'] = { signature: MAC_SIG, url };
              p['darwin-x86_64']  = { signature: MAC_SIG, url };
            }
            if (LINUX_SIG && LINUX_FILE) {
              p['linux-x86_64'] = { signature: LINUX_SIG, url: BASE_URL + '/' + enc(LINUX_FILE) };
            }
            if (WIN_SIG && WIN_FILE) {
              p['windows-x86_64'] = { signature: WIN_SIG, url: BASE_URL + '/' + enc(WIN_FILE) };
            }
            const manifest = {
              version: VERSION,
              pub_date: new Date().toISOString(),
              platforms: p
            };
            require('fs').writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            latest.json
          draft: false
          prerelease: false
          body: |
            ## 🎮 Download Agent Arcade

            ### 🤖 Install this using the Copilot CLI

            If you have [GitHub Copilot CLI](https://github.com/features/copilot/cli/) installed, you can install Agent Arcade with a single prompt:

            ```
            copilot --allow-all -p "Install the latest version of this app for me https://github.com/DanWahlin/agent-arcade/releases"
            ```

            > **Note:** The macOS app is not code-signed, so after installing on a Mac you'll still need to run the Terminal command shown below. The Windows app is code-signed.

            Or download the installer for your OS from the **Assets** list below.

            ### 🍎 macOS
            | File | Description |
            |------|-------------|
            | `*.dmg` | macOS installer (Universal — Apple Silicon + Intel) |

            > Download the `.dmg` file from the **Assets** list below.
            >
            > **Note:** The macOS app is not code-signed. After installing, open Terminal and run:
            > ```
            > sudo xattr -rd com.apple.quarantine /Applications/Agent\ Arcade.app
            > ```

            ### 🪟 Windows
            | File | Description |
            |------|-------------|
            | `*.msi` | Windows installer (x64) |

            > Download the `.msi` file from the **Assets** list below.
            >
            > **Note:** The Windows app is code-signed by Dan Wahlin (Azure Artifact Signing), so Smart App Control lets it run. While a new release builds reputation with Microsoft, SmartScreen may still warn you:
            > 1. If your browser warns about the download, select **"Keep"**
            > 2. If you see "Windows protected your PC", click **"More info"**
            > 3. Then click **"Run anyway"**

            ### 🐧 Linux
            | File | Description |
            |------|-------------|
            | `*.AppImage` | Universal Linux (run anywhere) |
            | `*.deb` | Debian/Ubuntu package |

            > **Omarchy / Arch:** install from the Omarchy Package Repository instead of downloading a file:
            > ```
            > omarchy pkg add agent-arcade-bin
            > ```
            > New versions reach the Omarchy repo about a day after this release is published.

            > **Other distros:** Download the `.AppImage` or `.deb` file from the **Assets** list below.
            >
            > **Note:** For the AppImage, make it executable first:
            > ```
            > chmod +x Agent.Arcade_*.AppImage
            > ./Agent.Arcade_*.AppImage
            > ```

            ## What's Changed

            ${{ steps.changelog.outputs.content }}

            ---
            *A retro arcade overlay for your desktop — play while your AI agent is thinking! Built with Tauri + Phaser + TypeScript.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
